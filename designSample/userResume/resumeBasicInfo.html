<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지원서 · SIXSPEC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <!-- Top Title -->
  <header class="bg-white shadow-sm">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-4 text-center">
      <h1 class="text-lg sm:text-xl font-bold">[SIXSPEC] 2025 우수인재 경력 채용 (DATA Intelligence 사업개발 및 제안)</h1>
    </div>
    <!-- Step Tabs -->
    <div id="tab-nav" class="grid grid-cols-5 border-b text-sm font-semibold">
      <button data-page="resumeBasicInfo.html"
        class="col-span-1 p-3 text-center border-b-4 border-transparent hover:bg-slate-100">1 기본정보</button>
      <button data-page="resumeAcademicResearch.html"
        class="col-span-1 p-3 text-center border-b-4 border-transparent hover:bg-slate-100">2 학력/연구/NCS</button>
      <button data-page="resumeLanguageCertificate.html"
        class="col-span-1 p-3 text-center border-b-4 border-transparent hover:bg-slate-100">3 어학/자격</button>
      <button data-page="resumeEssay.html"
        class="col-span-1 p-3 text-center border-b-4 border-transparent hover:bg-slate-100">4 자기소개서/역량기술서</button>
      <button data-page="resumeFinalSubmit.html"
        class="col-span-1 p-3 text-center border-b-4 border-transparent hover:bg-slate-100">5 최종제출</button>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const current = location.pathname.split('/').pop().toLowerCase().split('?')[0];

        document.querySelectorAll('#tab-nav button').forEach(btn => {
          const page = btn.dataset.page.toLowerCase();

          // 활성 탭 강조
          if (page === current) {
            btn.classList.remove('border-transparent');
            btn.classList.add('border-sky-600','text-sky-600','font-bold');
          }

          // 클릭 시 이동
          btn.addEventListener('click', () => {
            location.href = btn.dataset.page;
          });
        });
      });
    </script>

  </header>

  <main class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-8 space-y-12">
    <!-- Panel: 기본정보 -->
    <section class="bg-white shadow-sm ring-1 ring-slate-200 p-6">
      <header class="flex items-center justify-between border-b pb-3">
        <h2 class="font-bold">기본정보 <span class="text-rose-500 text-xs align-top">* 필수항목</span></h2>
      </header>
      <div class="mt-6 space-y-6">
        <!-- 영문이름 / 생년월일 -->
        <div class="grid grid-cols-12 gap-4 items-center">
          <label class="col-span-12 sm:col-span-2 font-semibold">*영문이름</label>
          <input class="col-span-12 sm:col-span-4 rounded-md border border-slate-300 px-3 py-2" placeholder="First Last"/>
          <label class="col-span-12 sm:col-span-2 font-semibold sm:text-right">*생년월일</label>
          <input type="date" class="col-span-12 sm:col-span-4 rounded-md border border-slate-300 px-3 py-2" />
        </div>
        <!-- 성별 / 국적 / 지원분야 -->
        <div class="grid grid-cols-12 gap-4 items-center">
          <label class="col-span-12 sm:col-span-2 font-semibold">성별</label>
          <div class="col-span-12 sm:col-span-4 flex gap-4">
            <label class="inline-flex items-center gap-2"><input type="radio" name="gender"/> 남</label>
            <label class="inline-flex items-center gap-2"><input type="radio" name="gender"/> 여</label>
          </div>
          <label class="col-span-12 sm:col-span-2 font-semibold sm:text-right">국적</label>
          <select class="col-span-12 sm:col-span-4 rounded-md border border-slate-300 px-3 py-2">
            <option>대한민국</option>
            <option>기타</option>
          </select>
        </div>
        <div class="grid grid-cols-12 gap-4 items-center">
          <label class="col-span-12 sm:col-span-2 font-semibold">*지원분야</label>
          <select class="col-span-12 sm:col-span-10 rounded-md border border-slate-300 px-3 py-2">
            <option>데이터 인텔리전스 사업개발</option>
            <option>AI 엔지니어</option>
            <option>플랫폼 기획</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Panel: 인적사항 (다음 섹션) -->
    <section id="sec-personal" class="bg-white shadow-sm ring-1 ring-slate-200 p-6">
      <header class="flex items-center justify-between border-b pb-3">
        <h2 class="font-bold">인적사항 <span class="text-rose-500 text-xs align-top">* 필수항목</span></h2>
      
      </header>

      <div class="mt-6 grid grid-cols-12 gap-6">
        <!-- 사진 -->
      <div class="col-span-12 sm:col-span-4">
        <div id="photoBox"
            class="relative aspect-[4/5] w-full max-w-[200px] rounded-md border border-dashed border-slate-300 bg-slate-50 overflow-hidden">
          <img id="photoPreview" alt="증명사진 미리보기"
              class="absolute inset-0 w-full h-full object-cover hidden">
          <span id="photoPlaceholder" class="absolute inset-0 flex items-center justify-center text-slate-500 text-sm">
            160×200<br/>사진 업로드
          </span>
        </div>

        <div class="mt-3 flex gap-2">
          <input id="photoFile" type="file" accept="image/*" class="hidden">
          <button id="btnUpload" class="rounded-md bg-slate-800 text-white px-4 py-2 text-sm">사진등록</button>
          <button id="btnDelete" class="rounded-md border px-4 py-2 text-sm">삭제</button>
        </div>
      </div>

      <!-- 주소/연락처 -->
        <div class="col-span-12 sm:col-span-8 space-y-4">
          <div class="grid grid-cols-12 gap-3 items-center">
            <label class="col-span-12 sm:col-span-3 font-semibold">주소</label>
            <input class="col-span-12 sm:col-span-9 rounded-md border border-slate-300 px-3 py-2" placeholder="현주소"/>
          </div>
          <div class="grid grid-cols-12 gap-3 items-center">
            <label class="col-span-12 sm:col-span-3 font-semibold">우편번호</label>
            <div class="col-span-12 sm:col-span-9 flex gap-2">
              <input class="w-32 rounded-md border border-slate-300 px-3 py-2" placeholder="우편번호"/>
              <button class="rounded-md border px-3 py-2">검색</button>
            </div>
          </div>
          <div class="grid grid-cols-12 gap-3 items-center">
            <label class="col-span-12 sm:col-span-3 font-semibold">특기</label>
            <input class="col-span-12 sm:col-span-9 rounded-md border border-slate-300 px-3 py-2" />
          </div>
          <div class="grid grid-cols-12 gap-3 items-center">
            <label class="col-span-12 sm:col-span-3 font-semibold">취미</label>
            <input class="col-span-12 sm:col-span-9 rounded-md border border-slate-300 px-3 py-2" />
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer navigation -->
  <footer id="footer-nav" class="sticky bottom-0 bg-white border-t">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-end gap-3">
      <button class="rounded-md border px-5 py-2">임시저장</button>
      <button id="nextButton" class="rounded-md bg-sky-600 px-6 py-2 text-white">다음</button>

      <script>
        document.getElementById('nextButton').addEventListener('click', () => {
        window.location.href = 'resumeAcademicResearch.html';
        });
      </script>
    </div>
  </footer>

  <!-- 사진 업로드 -->
  <script>
    (() => {
      const file = document.getElementById('photoFile');
      const btnUpload = document.getElementById('btnUpload');
      const btnDelete = document.getElementById('btnDelete');
      const preview = document.getElementById('photoPreview');
      const placeholder = document.getElementById('photoPlaceholder');
      let url; // ObjectURL

      const MAX_MB = 5;

      btnUpload.addEventListener('click', () => file.click());

      file.addEventListener('change', () => {
        const f = file.files[0];
        if (!f) return;
        if (!f.type.startsWith('image/')) { alert('이미지 파일만 업로드 가능합니다.'); file.value=''; return; }
        if (f.size > MAX_MB * 1024 * 1024) { alert('최대 5MB까지 업로드 가능합니다.'); file.value=''; return; }

        if (url) URL.revokeObjectURL(url);
        url = URL.createObjectURL(f);

        preview.src = url;
        preview.classList.remove('hidden');
        placeholder.classList.add('hidden');
      });

      btnDelete.addEventListener('click', () => {
        if (url) URL.revokeObjectURL(url);
        url = undefined;
        preview.src = '';
        preview.classList.add('hidden');
        placeholder.classList.remove('hidden');
        file.value = '';
      });
    })();
  </script>
</body>
</html>
