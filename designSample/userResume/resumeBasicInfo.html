<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지원서 · SIXSPEC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <!-- Top Title -->
  <header class="bg-white shadow-sm">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-4 text-center">
      <h1 class="text-lg sm:text-xl font-bold">[SIXSPEC] 2025 우수인재 경력 채용 (DATA Intelligence 사업개발 및 제안)</h1>
    </div>
    <!-- Step Tabs -->
    <div class="border-t border-slate-200 bg-white sticky top-0 z-30">
      <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-5 text-sm font-semibold">
          <div class="col-span-1 p-3 text-center bg-sky-600 text-white rounded-t-md">1 기본정보</div>
          <div class="col-span-1 p-3 text-center border-b">2 학력/연구/NCS</div>
          <div class="col-span-1 p-3 text-center border-b">3 어학/자격</div>
          <div class="col-span-1 p-3 text-center border-b">4 자기소개서/역량기술서</div>
          <div class="col-span-1 p-3 text-center border-b">5 최종제출</div>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-8 space-y-12">
    <!-- Panel: 기본정보 -->
    <section class="bg-white shadow-sm ring-1 ring-slate-200 p-6">
      <header class="flex items-center justify-between border-b pb-3">
        <h2 class="font-bold">기본정보 <span class="text-rose-500 text-xs align-top">* 필수항목</span></h2>
        <span class="text-xs text-slate-500">로그인 세션 남은시간 <strong class="text-amber-600">11분 15초 / 120분</strong></span>
      </header>
      <div class="mt-6 space-y-6">
        <!-- 영문이름 / 생년월일 -->
        <div class="grid grid-cols-12 gap-4 items-center">
          <label class="col-span-12 sm:col-span-2 font-semibold">*영문이름</label>
          <input class="col-span-12 sm:col-span-4 rounded-md border border-slate-300 px-3 py-2" placeholder="First Last"/>
          <label class="col-span-12 sm:col-span-2 font-semibold sm:text-right">*생년월일</label>
          <input type="date" class="col-span-12 sm:col-span-4 rounded-md border border-slate-300 px-3 py-2" />
        </div>
        <!-- 성별 / 국적 / 지원분야 -->
        <div class="grid grid-cols-12 gap-4 items-center">
          <label class="col-span-12 sm:col-span-2 font-semibold">성별</label>
          <div class="col-span-12 sm:col-span-4 flex gap-4">
            <label class="inline-flex items-center gap-2"><input type="radio" name="gender"/> 남</label>
            <label class="inline-flex items-center gap-2"><input type="radio" name="gender"/> 여</label>
          </div>
          <label class="col-span-12 sm:col-span-2 font-semibold sm:text-right">국적</label>
          <select class="col-span-12 sm:col-span-4 rounded-md border border-slate-300 px-3 py-2">
            <option>대한민국</option>
            <option>기타</option>
          </select>
        </div>
        <div class="grid grid-cols-12 gap-4 items-center">
          <label class="col-span-12 sm:col-span-2 font-semibold">*지원분야</label>
          <select class="col-span-12 sm:col-span-10 rounded-md border border-slate-300 px-3 py-2">
            <option>데이터 인텔리전스 사업개발</option>
            <option>AI 엔지니어</option>
            <option>플랫폼 기획</option>
          </select>
        </div>
      </div>

      <!-- Actions -->
      <div class="mt-8 flex justify-end gap-3">
        <button class="rounded-md border px-5 py-2">임시저장</button>
        <a href="#sec-personal" class="rounded-md bg-sky-600 px-6 py-2 text-white">다음</a>
      </div>
    </section>

    <!-- Panel: 인적사항 (다음 섹션) -->
    <section id="sec-personal" class="bg-white shadow-sm ring-1 ring-slate-200 p-6">
      <header class="flex items-center justify-between border-b pb-3">
        <h2 class="font-bold">인적사항 <span class="text-rose-500 text-xs align-top">* 필수항목</span></h2>
        <span class="text-xs text-slate-500">로그인 세션 남은시간 <strong class="text-amber-600">11분 15초 / 120분</strong></span>
      </header>

      <div class="mt-6 grid grid-cols-12 gap-6">
        <!-- 사진 -->
        <div class="col-span-12 sm:col-span-4">
          <div class="aspect-[4/5] w-full max-w-[200px] rounded-md border border-dashed border-slate-300 flex items-center justify-center bg-slate-50">
            <span class="text-slate-500 text-sm">160×200<br/>사진 업로드</span>
          </div>
          <div class="mt-3 flex gap-2">
            <button class="rounded-md bg-slate-800 text-white px-4 py-2 text-sm">사진등록</button>
            <button class="rounded-md border px-4 py-2 text-sm">삭제</button>
          </div>
        </div>

        <!-- 주소/연락처 -->
        <div class="col-span-12 sm:col-span-8 space-y-4">
          <div class="grid grid-cols-12 gap-3 items-center">
            <label class="col-span-12 sm:col-span-3 font-semibold">주소</label>
            <input class="col-span-12 sm:col-span-9 rounded-md border border-slate-300 px-3 py-2" placeholder="현주소"/>
          </div>
          <div class="grid grid-cols-12 gap-3 items-center">
            <label class="col-span-12 sm:col-span-3 font-semibold">우편번호</label>
            <div class="col-span-12 sm:col-span-9 flex gap-2">
              <input class="w-32 rounded-md border border-slate-300 px-3 py-2" placeholder="우편번호"/>
              <button class="rounded-md border px-3 py-2">검색</button>
            </div>
          </div>
          <div class="grid grid-cols-12 gap-3 items-center">
            <label class="col-span-12 sm:col-span-3 font-semibold">특기</label>
            <input class="col-span-12 sm:col-span-9 rounded-md border border-slate-300 px-3 py-2" />
          </div>
          <div class="grid grid-cols-12 gap-3 items-center">
            <label class="col-span-12 sm:col-span-3 font-semibold">취미</label>
            <input class="col-span-12 sm:col-span-9 rounded-md border border-slate-300 px-3 py-2" />
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="mt-8 flex justify-end gap-3">
        <button class="rounded-md border px-5 py-2">임시저장</button>
        <a href="#footer-nav" class="rounded-md bg-sky-600 px-6 py-2 text-white">다음</a>
      </div>
    </section>

    <!-- More placeholders to ensure scroll -->
    <section class="bg-white shadow-sm ring-1 ring-slate-200 p-6">
      <header class="border-b pb-3"><h2 class="font-bold">(다음 섹션 예시) 학력/연구/NCS</h2></header>
      <div class="mt-6 grid grid-cols-12 gap-4">
        <label class="col-span-12 sm:col-span-2 font-semibold">최종 학력</label>
        <select class="col-span-12 sm:col-span-10 rounded-md border border-slate-300 px-3 py-2">
          <option>학사</option><option>석사</option><option>박사</option>
        </select>
        <label class="col-span-12 sm:col-span-2 font-semibold">전공</label>
        <input class="col-span-12 sm:col-span-10 rounded-md border border-slate-300 px-3 py-2"/>
        <label class="col-span-12 sm:col-span-2 font-semibold">연구분야</label>
        <input class="col-span-12 sm:col-span-10 rounded-md border border-slate-300 px-3 py-2"/>
      </div>
    </section>
  </main>

  <!-- Footer navigation -->
  <footer id="footer-nav" class="sticky bottom-0 bg-white border-t">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-end gap-3">
      <button class="rounded-md border px-5 py-2">임시저장</button>
      <button class="rounded-md bg-sky-600 px-6 py-2 text-white">다음</button>
    </div>
  </footer>
</body>
</html>
