<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자기소개서/역량기술서 · SIXSPEC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <!-- Title + Steps -->
  <header class="bg-white shadow-sm">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-4 text-center">
      <h1 class="text-lg sm:text-xl font-bold">[SIXSPEC] 2025 우수인재 경력 채용 (DATA Intelligence 사업개발 및 제안)</h1>
    </div>
    <div class="border-t border-slate-200 bg-white sticky top-0 z-30">
      <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-5 text-sm font-semibold">
          <div class="col-span-1 p-3 text-center border-b">1 기본정보</div>
          <div class="col-span-1 p-3 text-center border-b">2 학력/연구/NCS</div>
          <div class="col-span-1 p-3 text-center border-b">3 어학/자격</div>
          <div class="col-span-1 p-3 text-center bg-sky-600 text-white rounded-t-md">4 자기소개서/역량기술서</div>
          <div class="col-span-1 p-3 text-center border-b">5 최종제출</div>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <section class="bg-white shadow-sm ring-1 ring-slate-200 p-6">
      <header class="border-b pb-3">
        <h2 class="font-bold">자기소개서 <span class="text-rose-500 text-xs align-top">* 필수항목</span></h2>
        <p class="mt-2 text-sm text-slate-600">본인이 경험했던 사실들을 질문에 맞게 논리적으로 기술하여 주시기 바랍니다.</p>
      </header>

      <!-- Q1 -->
      <div class="mt-6">
        <label class="block text-sm font-semibold">* Specguard DATA Intelligence 사업개발 및 제안 직무에 지원한 동기와 본인이 기여할 수 있는 부분에 대해 기술하시오 (최소 200자, 최대 1000자 입력가능)</label>
        <div class="mt-2 relative">
          <textarea rows="7" class="w-full rounded-md border border-slate-300 px-3 py-2" placeholder="내용을 입력하세요"></textarea>
          <div class="absolute bottom-2 right-3 text-xs text-slate-500">0/1000</div>
        </div>
      </div>

      <!-- Q2 -->
      <div class="mt-8">
        <label class="block text-sm font-semibold">* 지원 직무와 관련하여 최근 3년 내 최선의 결과를 도출한 도전은 무엇이었으며, 과정은 어떠하였는지 기술하시오 (최소 200자, 최대 1000자 입력가능)</label>
        <div class="mt-2 relative">
          <textarea rows="7" class="w-full rounded-md border border-slate-300 px-3 py-2" placeholder="내용을 입력하세요"></textarea>
          <div class="absolute bottom-2 right-3 text-xs text-slate-500">0/1000</div>
        </div>
      </div>

      <!-- Q3 -->
      <div class="mt-8">
        <label class="block text-sm font-semibold">* 본인의 장단점을 기술하고, 이것이 회사 업무에 어떤 영향을 미칠것인지 기술하시오 (최소 200자, 최대 1000자 입력가능)</label>
        <div class="mt-2 relative">
          <textarea rows="7" class="w-full rounded-md border border-slate-300 px-3 py-2" placeholder="내용을 입력하세요"></textarea>
          <div class="absolute bottom-2 right-3 text-xs text-slate-500">0/1000</div>
        </div>
      </div>

      <div class="mt-8 h-px bg-slate-200"></div>

      <!-- Footer actions inline -->
      <div class="mt-6 flex items-center justify-between">
        <div class="text-sm text-slate-600 flex items-center gap-3">
          <div class="inline-block h-6 w-6 rounded-full border border-slate-400"></div>
          <span>로그인 세션 남은시간 <span class="text-amber-600 font-semibold">115분 15초</span> / 120분</span>
          <span class="text-[11px]">연장</span>
          <span class="hidden sm:inline text-xs text-slate-500">접수기간 2000.00.00 (수) 15:00 ~ 2001.01.01 (일) 23:59</span>
        </div>
        <div class="flex items-center gap-3">
          <button class="rounded-md border px-5 py-2">임시저장</button>
          <button class="rounded-md bg-sky-600 px-6 py-2 text-white">다음</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
