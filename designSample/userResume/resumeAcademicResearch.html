    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const current = location.pathname.split('/').pop().toLowerCase().split('?')[0];

        document.querySelectorAll('#tab-nav button').forEach(btn => {
          const page = btn.dataset.page.toLowerCase();

          // 활성 탭 강조

            btn.classList.remove('border-transparent');
            btn.classList.add('border-sky-600','text-sky-600','font-bold');
          }

          // 클릭 시 이동
          btn.addEventListener('click', () => {
            location.href = btn.dataset.page;

<!-- 고등학교 재학 상태 -->
  <script>
    (() => {
      const ACTIVE = ['bg-sky-600','text-white','border-sky-600'];
      const INACTIVE = ['bg-white','text-slate-700','border','border-slate-300','hover:bg-slate-50'];

      const group = document.getElementById('highSchool-admission-status');
      const hidden = document.getElementById('highSchool-admissionStatus');

      function setActive(btn){
        group.querySelectorAll('button').forEach(b=>{
          b.classList.remove(...ACTIVE);
          b.classList.add(...INACTIVE);
          b.setAttribute('aria-checked','false');
        });
        btn.classList.remove(...INACTIVE);
        btn.classList.add(...ACTIVE);
        btn.setAttribute('aria-checked','true');
        hidden.value = btn.dataset.value;     // 서버 전송 값
      }

      // 클릭/키보드 처리
      group.addEventListener('click', e => {
        const btn = e.target.closest('button[data-value]');
        if (btn) setActive(btn);
      });
      group.addEventListener('keydown', e => {
        if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.dataset.value){
          e.preventDefault();
          setActive(document.activeElement);
        }
      });

      // 기본값 적용(옵션)
      const def = group.dataset.default;
      if (def){
        const btn = group.querySelector(`button[data-value="${def}"]`);
        if (btn) setActive(btn);
      }
    })();
</script>

// 셀렉트 초기화 + 연동
function initRegionPicker(cityId, locationId, presetCity = '', presetLocation = '') {
  const $city = document.getElementById(cityId);
  const $location = document.getElementById(locationId);

  // 시/도 채우기
  Object.keys(KR_REGIONS).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    $city.appendChild(opt);
  });

  // 시/도 변경 → 구/군 채우기
  $city.addEventListener('change', () => {
    const list = KR_REGIONS[$city.value] || [];
    $location.innerHTML = '<option value="">구/군</option>';
    list.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g; opt.textContent = g;
      $location.appendChild(opt);
    });
    $location.disabled = list.length === 0;
  });

  // 프리셋 적용(수정 화면 등)
  if (presetCity) {
    $city.value = presetCity;
    $city.dispatchEvent(new Event('change'));
    if (presetLocation) $location.value = presetLocation;
  }
}

// 고등학교 블록용
initRegionPicker('highSchool-city','highSchool-location');
