<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SpecGuard 지원자 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
    <!-- Top Bar -->
    <header class="bg-[#2c3e50] text-white">
    <div class="mx-auto max-w-6xl px-6 py-4">
    <div class="text-3xl font-extrabold tracking-widest">SPECGUARD</div>
    <div class="mt-1 h-1 w-28 bg-white/80"></div>
    <p class="sr-only">이력 검증 시스템</p>
    </div>
    </header>

<!-- Main -->
<main class="mx-auto max-w-6xl px-6 py-10">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
    <!-- Left: Login -->
    <section class="md:col-span-6">
        <div class="rounded-3xl bg-amber-400/90 p-8 shadow">
        <h2 class="text-2xl font-extrabold mb-6">로그인</h2>

        <label class="block text-sm font-semibold mb-2">아이디</label>
        <input type="text" placeholder="아이디를 입력해주세요."
                class="w-full h-12 rounded-md border border-slate-300 px-4 bg-white/70 placeholder-slate-500"/>

        <label class="block text-sm font-semibold mt-5 mb-2">비밀번호</label>
        <input type="password" placeholder="비밀번호를 입력해주세요."
                class="w-full h-12 rounded-md border border-slate-300 px-4 bg-white/70 placeholder-slate-500"/>

          <button class="mt-6 w-full h-12 rounded-md bg-[#2c3e50] text-white font-semibold">
            로그인
          </button>

          <div class="mt-6 flex items-center justify-between text-sm text-white/90">
            <div class="space-x-4">
              <a href="#" class="underline underline-offset-2">아이디 찾기</a>
              <a href="#" class="underline underline-offset-2">비밀번호 찾기</a>
            </div>
            <a href="userSignUp.html" class="underline underline-offset-2">회원 가입</a>
          </div>
        </div>
      </section>

      <!-- Divider (mobile) -->
      <div class="md:hidden h-px bg-slate-300"></div>

      <!-- Right: Search + Job list -->
      <section class="md:col-span-6 md:pl-8 md:border-l md:border-slate-300">
        <!-- Search -->
        <div class="flex items-center gap-3">
          <input type="text" placeholder="검색 내용을 입력하세요."
                 class="w-full h-12 rounded-md border border-slate-300 px-4 placeholder-slate-400"/>
          <button class="shrink-0 h-12 px-4 rounded-md bg-white border border-slate-300 hover:bg-slate-50">
            검색
          </button>
        </div>

        <!-- 채용 공고 리스트 (더미) --> 
        <ul class="mt-6 space-y-6">
          <li>
            <a href="#" class="block">
              <h3 class="text-lg font-extrabold text-slate-700">BackEnd 경력</h3>
              <p class="text-slate-500 text-sm mt-1">2025/07/05 ~ 2025/09/10</p>
            </a>
          </li>
          <li>
            <a href="#" class="block">
              <h3 class="text-lg font-extrabold text-slate-700">데이터 분석 전문가 (계약직)</h3>
              <p class="text-slate-500 text-sm mt-1">2025/09/06 ~ 2025/10/01</p>
            </a>
          </li>
          <li>
            <a href="#" class="block">
              <h3 class="text-lg font-extrabold text-slate-700">급여/복리후생 담당 계약직 채용</h3>
              <p class="text-slate-500 text-sm mt-1">2025/09/01 ~ 2025/09/30</p>
            </a>
          </li>
          <li>
            <a href="#" class="block">
              <h3 class="text-lg font-extrabold text-slate-700">설비담당 엔지니어 모집 (울산)</h3>
              <p class="text-slate-500 text-sm mt-1">2025/08/17 ~ 2025/09/30</p>
            </a>
          </li>
        </ul>
      </section>
    </div>
  </main>

  <!-- Footer spacer -->
  <div class="h-10"></div>
</body>
</html>
