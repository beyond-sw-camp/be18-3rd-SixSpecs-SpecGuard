<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지원자 회원가입</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto max-w-5xl bg-white shadow-sm mt-10 mb-20 p-8 sm:p-12">
    <!-- Title -->
    <h1 class="text-4xl font-extrabold text-center">지원자 회원가입</h1>
    <div class="mt-6 h-1 bg-black"></div>

    <!-- Consent banner -->
    <div class="mt-6">
      <div class="grid grid-cols-12 items-center gap-4">
        <div class="col-span-5 sm:col-span-3 text-slate-700 font-semibold">개인정보 수집 이용 동의</div>
        <div class="col-span-7 sm:col-span-9 text-slate-700">필수 항목에 동의해 주세요.</div>
      </div>
      <div class="mt-3 h-1 bg-indigo-900"></div>
    </div>

    <!-- Form -->
    <form class="mt-8 space-y-8">
      <!-- Name -->
      <div>
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-5 sm:col-span-3 text-slate-700 font-semibold">성명</label>
          <div class="col-span-7 sm:col-span-9">
            <input type="text" placeholder="공백 없이 입력하세요" class="w-full rounded-md border border-slate-300 px-4 py-2"/>
          </div>
        </div>
        <div class="mt-3 h-px bg-slate-200"></div>
      </div>

      <!-- Phone -->
      <div>
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-5 sm:col-span-3 text-slate-700 font-semibold">휴대전화</label>
          <div class="col-span-7 sm:col-span-9 flex items-center gap-3">
            <input type="text" class="w-20 rounded-md border border-slate-300 px-3 py-2 text-center" maxlength="3" placeholder="010"/>
            <span>-</span>
            <input type="text" class="w-24 rounded-md border border-slate-300 px-3 py-2 text-center" maxlength="4" placeholder="1234"/>
            <span>-</span>
            <input type="text" class="w-24 rounded-md border border-slate-300 px-3 py-2 text-center" maxlength="4" placeholder="5678"/>
          </div>
        </div>
        <p class="mt-2 ml-0 sm:ml-40 text-sm text-slate-500">전형결과와 알림에 사용되오니 반드시 연결가능한 번호로 입력하세요</p>
        <div class="mt-3 h-px bg-slate-200"></div>
      </div>

      <!-- Email -->
      <div>
        <div class="grid grid-cols-12 items-start gap-4">
          <label class="col-span-5 sm:col-span-3 text-slate-700 font-semibold pt-2">이메일</label>
          <div class="col-span-7 sm:col-span-9 w-full space-y-3">
            <input type="email" placeholder="이메일을 입력해주세요" class="w-full rounded-md border border-slate-300 px-4 py-2"/>
            <input type="email" placeholder="이메일 확인을 위해 다시 한번 입력해주세요" class="w-full rounded-md border border-slate-300 px-4 py-2"/>
            <p class="text-sm text-slate-500">비밀번호 찾기 및 전형결과 알림에 이용되오니 자주 사용하는 메일 주소를 입력해주세요.</p>
          </div>
        </div>
        <div class="mt-3 h-px bg-slate-200"></div>
      </div>

      <!-- Password -->
      <div>
        <div class="grid grid-cols-12 items-start gap-4">
          <label class="col-span-5 sm:col-span-3 text-slate-700 font-semibold pt-2">비밀번호</label>
          <div class="col-span-7 sm:col-span-9 w-full space-y-3">
            <input type="password" placeholder="비밀번호를 입력해주세요" class="w-full rounded-md border border-slate-300 px-4 py-2"/>
            <input type="password" placeholder="비밀번호 확인을 위해 다시 한번 입력해주세요" class="w-full rounded-md border border-slate-300 px-4 py-2"/>
            <p class="text-sm text-slate-500">8~9자 영문 대문자/소문자/특수문자/숫자 중 3종류, 혹은 10자 이상의 영문/숫자/특수문자 중 2종류를 사용하세요</p>
          </div>
        </div>
        <div class="mt-3 h-px bg-slate-200"></div>
      </div>

      <!-- Phone verify -->
      <div>
        <div class="grid grid-cols-12 items-center gap-4">
          <label class="col-span-5 sm:col-span-3 text-slate-700 font-semibold">본인 확인</label>
          <div class="col-span-7 sm:col-span-9">
            <button type="button" class="rounded-md bg-slate-800 px-4 py-2 text-white font-semibold">휴대전화 인증</button>
          </div>
        </div>
        <div class="mt-6 h-px bg-slate-200"></div>
      </div>

      <!-- Action buttons (visual only) -->
      <div class="flex justify-end gap-3 pt-2">
        <button type="button" class="rounded-md border border-slate-300 px-5 py-2">취소</button>
        <button type="button" class="rounded-md bg-amber-500 px-6 py-2 text-white font-semibold">가입하기</button>
      </div>
    </form>
  </main>
</body>
</html>
