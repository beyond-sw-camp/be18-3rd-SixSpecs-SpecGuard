<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>휴대전화 인증 · 팝업</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .dash { stroke-dasharray: 283; stroke-dashoffset: 0; transition: stroke-dashoffset .3s linear; }
  </style>
</head>
<body class="min-h-screen bg-black/60 flex items-center justify-center">
  <!-- Modal -->
  <div class="w-[960px] max-w-[96vw] rounded-2xl bg-white shadow-2xl">
    <!-- Header -->
    <div class="flex items-center justify-between px-8 py-4 border-b">
      <h1 class="text-2xl sm:text-3xl font-extrabold">휴대전화 인증</h1>
      <button aria-label="닫기" class="p-2 rounded-md hover:bg-slate-100" onclick="window.close?.()"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>

    <!-- Body -->
    <div class="px-8 py-8">
      <!-- Row: input + action -->
      <div class="grid grid-cols-12 gap-4 items-center">
        <div class="col-span-9">
          <input type="tel" placeholder="전화번호를 입력하세요" class="w-full h-14 rounded-md border border-slate-300 px-5 text-lg outline-none" />
        </div>
        <div class="col-span-3 flex justify-end">
          <button class="h-14 w-full sm:w-auto px-6 rounded-xl border-2 border-sky-400 text-sky-600 font-semibold bg-white">인증번호생성</button>
        </div>
      </div>

      <!-- Row: timer + text + QR -->
      <div class="mt-8 grid grid-cols-12 gap-6 items-center">
        <!-- Timer -->
        <div class="col-span-3 flex items-center gap-4">
          <svg viewBox="0 0 100 100" class="w-28 h-28">
            <circle cx="50" cy="50" r="45" fill="none" stroke="#e5e7eb" stroke-width="3"/>
            <circle id="ring" cx="50" cy="50" r="45" fill="none" stroke="#fbbf24" stroke-width="4" class="dash" transform="rotate(-90 50 50)"/>
            <line id="hand" x1="50" y1="50" x2="50" y2="20" stroke="#111827" stroke-width="2" class="origin-center"/>
          </svg>
        </div>

        <!-- Helper text -->
        <div class="col-span-6">
          <p class="font-semibold">인증 만료까지 남은시간</p>
          <p class="text-lg mt-1" id="left">03:00 / 03:00</p>
          <p class="mt-4 text-slate-700">우측의 QR 코드를 촬영하여 인증번호를 발송해주세요.</p>
        </div>

        <!-- QR -->
        <div class="col-span-3 flex justify-end">
          <div class="p-2 border rounded-xl">
            <!-- 단순 플레이스홀더 QR -->
            <img alt="QR" class="w-40 h-40" src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=SMSTO:01000000000:%EC%9D%B8%EC%A6%9D%EB%B2%88%ED%98%B8%3A%20123456"/>
          </div>
        </div>
      </div>

      <!-- CTA -->
      <div class="mt-10">
        <button class="w-full h-16 rounded-xl bg-[#4F8EF7] text-white text-2xl font-extrabold">인증 대기중</button>
      </div>
    </div>
  </div>

  <!-- Minimal demo timer for visuals only -->
  <script>
    // 3분 카운트다운 시각효과 전용
    const total = 180; // seconds
    let t = total;
    const ring = document.getElementById('ring');
    const hand = document.getElementById('hand');
    const left = document.getElementById('left');
    const C = 2 * Math.PI * 45; // circumference
    const tick = () => {
      const mm = String(Math.floor(t/60)).padStart(2,'0');
      const ss = String(t%60).padStart(2,'0');
      left.textContent = `${mm}:${ss} / 03:00`;
      const ratio = 1 - (t/total);
      ring.style.strokeDasharray = C;
      ring.style.strokeDashoffset = C * ratio;
      const deg = (360 * ratio) - 90; // -90 to start at top
      hand.setAttribute('transform', `rotate(${deg} 50 50)`);
      if (t>0) t--; else clearInterval(id);
    };
    const id = setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
